<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homelab Takeout</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Homelab Takeout</h1>
    <div class="header-actions">
      <button id="refresh-btn">Refresh</button>
      <button id="logout-btn" hidden>Sign out</button>
    </div>
  </header>

  <div id="auth-screen" class="auth-screen" hidden>
    <form id="auth-form" class="auth-card">
      <h2>Homelab Takeout</h2>
      <p id="auth-intro" class="auth-intro"></p>
      <input type="text" name="username" value="admin" autocomplete="username" hidden />
      <div class="field" id="setup-code-field" hidden>
        <label for="auth-setup-code">Setup code</label>
        <input id="auth-setup-code" autocomplete="one-time-code" spellcheck="false" />
        <span class="hint">Printed in the server logs (<code>docker logs homelab-takeout</code> or
          <code>journalctl -u homelab-takeout</code>) and saved in <code>state/setup-code.txt</code>.</span>
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" required />
      </div>
      <div class="field" id="auth-confirm-field" hidden>
        <label for="auth-confirm">Repeat password</label>
        <input id="auth-confirm" type="password" autocomplete="new-password" />
        <span class="hint">At least 12 characters. A few random words work well.</span>
      </div>
      <p id="auth-error" class="auth-error" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="auth-submit">Sign in</button>
    </form>
  </div>

  <main>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:2rem 0 .75rem">
      <div class="section-title" style="margin:0">Services</div>
      <button class="btn btn-primary btn-sm" onclick="runAll()">Run All</button>
    </div>
    <div id="service-grid" class="grid">
      <p style="color:var(--muted)">Loading…</p>
    </div>

    <div class="section-title">Destinations</div>
    <div id="destination-grid" class="grid">
      <p style="color:var(--muted)">Loading…</p>
    </div>

    <div class="section-title">Settings</div>
    <div class="settings-row">
      <div id="settings-panel">
        <p style="color:var(--muted)">Loading…</p>
      </div>
      <div id="security-panel"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="config-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Configure</h2>
        <button class="modal-close" onclick="closeModal()">&#x2715;</button>
      </div>
      <div class="env-form" id="env-form"></div>
      <div class="save-row">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEnvVars()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="login-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="login-title">Log in</h2>
        <button class="modal-close" onclick="closeLogin()">&#x2715;</button>
      </div>
      <p id="login-steps" class="login-steps"></p>
      <div id="login-code" class="login-code"></div>
      <div class="save-row">
        <button class="btn btn-secondary" onclick="copyLoginCode()">Copy code</button>
        <a id="login-link" class="btn btn-primary" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <p id="login-status" class="login-status"></p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
