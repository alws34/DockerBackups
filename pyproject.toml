[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "S603",   # subprocess calls — intentional in worker base class
    "S607",   # partial executable path — runtime-resolved via shutil.which
    "ANN101", # missing self annotation — not required in Python 3.12
    "ANN102", # missing cls annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]  # security and annotation rules relaxed in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
