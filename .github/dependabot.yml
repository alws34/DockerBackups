version: 2
# Version updates: monthly, one PR per ecosystem, into dev (dev reaches main through a
# tested PR). Security fixes open as soon as an alert does, grouped per ecosystem; GitHub
# always opens those against the default branch (main), whatever target-branch says.
updates:
  # Picks up requirements.in/.txt and requirements-dev.in/.txt (pip-compile, with hashes).
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # Bitwarden CLI (bw/package.json + package-lock.json).
  - package-ecosystem: npm
    directory: /bw
    target-branch: dev
    ignore:
      # Bitwarden CLI 2026.9.x can't unlock against Vaultwarden: its user key id
      # backfill calls an endpoint Vaultwarden doesn't have (404). Lift this once
      # Vaultwarden supports it, and test the Vaultwarden worker against a real server.
      - dependency-name: "@bitwarden/cli"
        versions: [">2026.5.0"]
    schedule:
      interval: monthly
    groups:
      bitwarden-cli:
        patterns: ["*"]
      bitwarden-cli-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base image digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  # SHA-pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
