# Reusable release builder, called by release.yml on a v* tag. Signatures and provenance
# name THIS file as the signer, which is what users verify against
# (see docs/VERIFYING_RELEASES.md). No container image is built or pushed.
name: Build release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and attest source tarball
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing (cosign + attest)
      attestations: write # store the provenance attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create deterministic source tarball
        id: tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="homelab-takeout-${TAG#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" "$GITHUB_SHA"
          sha256sum "dist/${name}.tar.gz"
          echo "file=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/${name}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps.tarball.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign tarball with Sigstore (keyless)
        env:
          FILE: ${{ steps.tarball.outputs.file }}
        run: cosign sign-blob --yes --bundle "${FILE}.sigstore.json" "$FILE"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarball.outputs.file }}

      # One Sigstore bundle per line (JSON Lines), as `gh attestation verify --bundle` reads it.
      - name: Keep the provenance bundle as a release asset
        env:
          FILE: ${{ steps.tarball.outputs.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > "${FILE}.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*
