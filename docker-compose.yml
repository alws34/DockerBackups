services:
  homelab-takeout:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: homelab-takeout
    restart: unless-stopped

    env_file:
      - .env

    environment:
      CONFIG_FILE: /config/services.json
      BACKUP_ROOT: /backups
      LOG_ROOT: /logs
      STATE_ROOT: /state
      ENV_FILE: /app-env/.env
      TZ: ${TZ:-UTC}
      WEB_PORT: "9100"

    network_mode: host

    volumes:
      - ./config:/config
      - ./.env:/app-env/.env:rw
      - ./backups:/backups
      - ./logs:/logs
      - ./state:/state
